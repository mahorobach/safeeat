<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VegEatEase 管理者ダッシュボード</title>
  <link rel="stylesheet" href="safeat.css?v=0.5.2">
  <link rel="stylesheet" href="admin.css?v=0.5.1">
</head>
<body>

<header>
  <div>
    <a href="index.html" class="logo-link">
      <div class="logo">🥬 VegEatEase</div>
    </a>
  </div>
  <a href="index.html" class="admin-header-back-link">← チェックに戻る</a>
</header>

<main>
  <div id="access-denied" class="access-denied" style="display:none">
    <h2>🚫 アクセスできません</h2>
    <p>管理者アカウントでログインしてください。</p>
    <a href="index.html">← チェックに戻る</a>
  </div>

  <div id="admin-content" class="admin-wrap" style="display:none">

    <div class="admin-header">
      <div class="admin-title">🛠️ 管理者ダッシュボード</div>
    </div>

    <div class="admin-card">
      <div class="admin-card-title">ユーザー検索・プラン変更</div>
      <div class="admin-search">
        <input type="email" id="admin-search-input" placeholder="メールアドレスで検索（空欄で全件）">
        <button type="button" id="admin-search-btn">検索</button>
      </div>
      <div id="admin-table-wrap">
        <p class="admin-msg">検索してください</p>
      </div>
    </div>

    <div class="admin-card">
      <div class="admin-card-title">統計情報</div>
      <div id="admin-stats">
        <p class="admin-msg">読み込み中...</p>
      </div>
    </div>

  </div>
</main>

<script src="site-config.js?v=0.5.2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth.js?v=0.5.2"></script>
<script src="admin.js?v=0.5.1"></script>
</body>
</html>
