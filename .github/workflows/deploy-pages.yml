name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp -r web/ _site/web/
          cp -r shared/ _site/shared/
          cat > _site/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="ja"><head>
          <meta charset="UTF-8">
          <meta http-equiv="refresh" content="0; url=web/index.html">
          <title>SafeEat</title>
          </head><body>
          <p><a href="web/index.html">SafeEat を開く</a></p>
          </body></html>
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
